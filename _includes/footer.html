<footer class="site-footer">
  <div class="wrap footer-inner">
    <div class="footer-left">
      <span class="footer-name">{{ site.title }}</span>
      <span class="footer-meta">© {{ 'now' | date: "%Y" }}</span>
    </div>
    <ul class="footer-links">
      {% if site.social.youtube %}<li><a href="https://youtube.com/@{{ site.social.youtube }}">YouTube</a></li>{% endif %}
      {% if site.social.x %}<li><a href="https://x.com/{{ site.social.x }}">X</a></li>{% endif %}
      {% if site.social.linkedin %}<li><a href="https://linkedin.com/in/{{ site.social.linkedin }}">LinkedIn</a></li>{% endif %}
    </ul>
  </div>
</footer>
