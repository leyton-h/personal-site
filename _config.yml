# --- Site settings ---
title: Leyton Harrington
tagline: Builder, writer, founder.
description: >-
  Personal site of Leyton — notes on building, medicine, and the things
  worth paying attention to.
author: Leyton
email: hello@leytonh.com
url: "https://leytonh.com"
baseurl: ""

# --- Social / contact (edit freely) ---
social:
  github: leyton-h
  # twitter: yourhandle
  # linkedin: yourhandle

# --- Build settings ---
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
timezone: America/New_York

kramdown:
  input: GFM
  syntax_highlighter: rouge

# --- Collections / pagination handled manually in templates ---
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: /feed.xml

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
  - .sass-cache
  - node_modules
