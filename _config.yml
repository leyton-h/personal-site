# --- Site settings ---
title: Leyton Harrington
url: "https://leytonh.com"
baseurl: ""

# --- Social ---
social:
  youtube: leytonh
  x: leytonpi
  linkedin: leytonh

# --- Build settings ---
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/
timezone: America/New_York

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# --- Defaults ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
  - .sass-cache
  - node_modules
